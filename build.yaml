overview: "Live events and 24/7 channels from any external API"
description: >
  Live Hub adds a real-time live section to Jellyfin, fed by external APIs of any site
  (REST JSON, M3U/XMLTV, Xtream Codes, direct HLS/DASH/MP4/TS). Sources are declarative
  Provider Definitions created from a wizard, without code. Content appears natively on every
  client through the Channels section ("Live Hub") and Live TV (channels + EPG), with
  multi-source/quality/language selection, an internal HLS relay with failover and
  per-provider egress profiles (HTTP/SOCKS5 proxy, e.g. gluetun VPN).
  The plugin does not host or distribute any content.
